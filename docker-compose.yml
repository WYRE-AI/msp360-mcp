services:
  # Gateway mode. Username and password arrive per request on X-MSP360-* headers.
  # Do not set MSP360_USERNAME, MSP360_PASSWORD, or env_file here. That would
  # put static vendor credentials in the container. The project .env is used
  # only for Compose interpolation of CONDUIT_S2S_SECRET and LOG_LEVEL. For
  # AUTH_MODE=env, pass MSP360_USERNAME and MSP360_PASSWORD on that process
  # instead (see the README).
  msp360-mcp:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
